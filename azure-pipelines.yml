# Azure DevOps Pipeline for Contoso Vibe Engineering Monorepo
# Triggered on main and develop branches

trigger:
  branches:
    include:
      - main
      - develop/*
  paths:
    exclude:
      - "*.md"
      - .github/**

pr:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

variables:
  PNPM_VERSION: "10.26.2"
  NODE_VERSION: "22"
  TURBO_TEAM: $(TURBO_TEAM)
  TURBO_TOKEN: $(TURBO_TOKEN)

stages:
  - stage: Build
    displayName: "Build & Test"
    jobs:
      - job: BuildAndTest
        displayName: "Build, Lint & Test"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: "Install Node.js"

          - script: |
              corepack disable
              npm install -g pnpm@$(PNPM_VERSION)
            displayName: "Install pnpm"

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              path: $(Pipeline.Workspace)/.pnpm-store
              restoreKeys: |
                pnpm | "$(Agent.OS)"
            displayName: "Cache pnpm store"

          - script: |
              pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
              pnpm install --frozen-lockfile
            displayName: "Install dependencies"

          - script: pnpm run lint
            displayName: "Lint"
            continueOnError: false

          - script: pnpm run build
            displayName: "Build"

          - script: pnpm test
            displayName: "Run tests"

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/junit.xml"
              mergeTestResults: true
              failTaskOnFailedTests: true
            displayName: "Publish test results"

          - task: PublishCodeCoverageResults@1
            condition: succeededOrFailed()
            inputs:
              codeCoverageTool: "Cobertura"
              summaryFileLocation: "**/coverage/cobertura-coverage.xml"
            displayName: "Publish code coverage"

  - stage: SecurityScan
    displayName: "Security Scan"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DependencyCheck
        displayName: "Dependency Security Check"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: "Install Node.js"

          - script: |
              corepack disable
              npm install -g pnpm@$(PNPM_VERSION)
              pnpm install --frozen-lockfile
            displayName: "Setup pnpm"

          - script: pnpm audit --audit-level=high
            displayName: "Audit dependencies"
            # Fail the build on high+ severity vulnerabilities. Previously
            # `continueOnError: true` silently masked findings — see #234.
            # Use `pnpm audit --audit-level=critical` if temporary noise
            # blocks merges, but never restore continueOnError.
            continueOnError: false

