name: Build trusted factory runtime
description: Build the factory helpers from a caller-provided trusted checkout.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.26.2
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
    - name: Install factory dependencies
      shell: bash
      run: pnpm --filter @workspace/dark-factory... install --frozen-lockfile --ignore-scripts
    - name: Build factory runtime
      shell: bash
      run: pnpm --filter @workspace/dark-factory build
