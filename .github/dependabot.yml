# Dependabot configuration for contoso-vibe-engineering monorepo
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ──────────────────────────────────────────────
  # npm/pnpm — monorepo workspace packages
  # ──────────────────────────────────────────────
  - package-ecosystem: "npm"
    directories:
      - "/"            # root package.json + pnpm-lock.yaml
      - "/apps/*"      # frontend applications
      - "/packages/*"  # shared libraries & configs
      - "/services/*"  # backend microservices
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"

  # npm — standalone workiq compliance script (outside pnpm workspace)
  - package-ecosystem: "npm"
    directory: "/.github/scripts/workiq-decision-compliance"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ──────────────────────────────────────────────
  # GitHub Actions — keep workflow actions current
  # ──────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # ──────────────────────────────────────────────
  # Docker — service container base images
  # ──────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/services/ai-tool-digest"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"

  # ──────────────────────────────────────────────
  # pip — Python skill script dependencies
  # ──────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/.github/skills/mcp-builder/scripts"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
