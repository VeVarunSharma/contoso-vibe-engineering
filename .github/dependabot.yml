# Dependabot configuration for contoso-vibe-engineering monorepo
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ──────────────────────────────────────────────
  # npm/pnpm — monorepo workspace packages
  # ──────────────────────────────────────────────
  - package-ecosystem: "npm"
    directories:
      - "/"            # root package.json + pnpm-lock.yaml
      - "/apps/*"      # frontend applications
      - "/packages/*"  # shared libraries & configs
      - "/services/*"  # backend microservices
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # Cross-directory grouping: 1 PR per shared dependency across all dirs
      monorepo-deps:
        group-by: dependency-name
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # Group security update PRs together
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    # Cooldown: avoid early-adopter issues on brand-new releases
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 2
    open-pull-requests-limit: 15
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"

  # npm — standalone workiq compliance script (outside pnpm workspace)
  - package-ecosystem: "npm"
    directory: "/.github/scripts/workiq-decision-compliance"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ──────────────────────────────────────────────
  # GitHub Actions — keep workflow actions current
  # ──────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # ──────────────────────────────────────────────
  # Docker — service container base images
  # ──────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/services/ai-tool-digest"
    schedule:
      interval: "weekly"
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"

  # ──────────────────────────────────────────────
  # Docker Compose — development environment images
  # ──────────────────────────────────────────────
  - package-ecosystem: "docker-compose"
    directory: "/apps/octocat-blog-app"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"

  # ──────────────────────────────────────────────
  # pip — Python skill script dependencies
  # ──────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/.github/skills/mcp-builder/scripts"
    schedule:
      interval: "monthly"
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"

  # ──────────────────────────────────────────────
  # NuGet — .NET service dependencies
  # ──────────────────────────────────────────────
  - package-ecosystem: "nuget"
    directory: "/services/rigidport"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      nuget-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ──────────────────────────────────────────────
  # Terraform — infrastructure provider versions
  # ──────────────────────────────────────────────
  - package-ecosystem: "terraform"
    directory: "/infra/terraform/azure-vancouver-example"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "deps"
      include: "scope"
