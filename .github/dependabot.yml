# Dependabot configuration for contoso-vibe-engineering monorepo
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ──────────────────────────────────────────────
  # npm/pnpm — monorepo workspace packages
  # ──────────────────────────────────────────────
  - package-ecosystem: "npm"
    directories:
      - "/" # root package.json + pnpm-lock.yaml
      - "/apps/*" # frontend applications
      - "/packages/*" # shared libraries & configs
      - "/services/*" # backend microservices
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    # The combined pnpm workspace version updater was canceled twice after
    # roughly 55 minutes. Keep alerts and grouped security updates enabled
    # while pausing the unreliable scheduled version-update scan.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"

  # npm — standalone workiq compliance script (outside pnpm workspace)
  - package-ecosystem: "npm"
    directory: "/.github/scripts/workiq-decision-compliance"
    schedule:
      interval: "weekly"
      day: "monday"
    # npm ci confirms the standalone lockfile is valid, but Dependabot's version
    # updater rejects this .github package. Keep alerts while stopping failed
    # scheduled version-update attempts.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ──────────────────────────────────────────────
  # Terraform — infrastructure provider versions
  # ──────────────────────────────────────────────
  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/azure-vancouver-example/*"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "infrastructure"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ──────────────────────────────────────────────
  # GitHub Actions — keep workflow actions current
  # ──────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
    # gh-aw lock workflows are generated from Markdown and must be recompiled
    # so the compiler and runtime are upgraded together.
    exclude-paths:
      - ".github/workflows/*.lock.yml"
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "ci"

  # ──────────────────────────────────────────────
  # Docker — service container base images
  # ──────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/services/ai-tool-digest"
    schedule:
      interval: "weekly"
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "infrastructure"
    commit-message:
      prefix: "deps"

  # ──────────────────────────────────────────────
  # Docker Compose — development environment images
  # ──────────────────────────────────────────────
  - package-ecosystem: "docker-compose"
    directory: "/apps/octocat-blog-app"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "infrastructure"
    commit-message:
      prefix: "deps"

  # ──────────────────────────────────────────────
  # pip — Python skill script dependencies
  # ──────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/.github/skills/mcp-builder/scripts"
    schedule:
      interval: "monthly"
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "packages"
    commit-message:
      prefix: "deps"

  # ──────────────────────────────────────────────
  # NuGet — .NET service dependencies
  # ──────────────────────────────────────────────
  - package-ecosystem: "nuget"
    directory: "/services/rigidport"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      nuget-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "packages"
    commit-message:
      prefix: "deps"
      include: "scope"
