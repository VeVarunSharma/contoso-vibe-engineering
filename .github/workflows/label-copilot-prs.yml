name: Label Copilot PRs for Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing Copilot pull request to label
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: label-copilot-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  label:
    name: Add automerge label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Verify Copilot author and apply label
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number: $PR_NUMBER" >&2
            exit 1
          fi

          PR_STATE=$(gh api "repos/$REPO/pulls/$PR_NUMBER")

          if ! jq -e '
            .state == "open"
            and .user.id == 198982749
            and .user.login == "Copilot"
            and .user.type == "Bot"
            and (.head.ref | startswith("copilot/"))
            and .head.repo.full_name == $repo
          ' --arg repo "$REPO" <<< "$PR_STATE" > /dev/null; then
            echo "::notice::PR #$PR_NUMBER is not an eligible Copilot coding-agent pull request."
            exit 0
          fi

          gh api \
            --method POST \
            "repos/$REPO/issues/$PR_NUMBER/labels" \
            -f 'labels[]=automerge' \
            --silent
