name: Label Copilot PRs for Factory Validation

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
  checks: read

concurrency:
  group: dark-factory-mutation
  cancel-in-progress: false

jobs:
  label:
    name: Validate ownership before labeling
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.user.id == 198982749 &&
      github.event.pull_request.user.login == 'Copilot' &&
      github.event.pull_request.user.type == 'Bot' &&
      startsWith(github.event.pull_request.head.ref, 'copilot/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/factory-runtime
      - uses: ./.github/actions/factory-transition
        with:
          lane: complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FACTORY_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_TASKS_TOKEN: ${{ secrets.COPILOT_AGENT_TASKS_TOKEN }}
          PR_MERGE_AUTOMATION_TOKEN: ${{ secrets.PR_MERGE_AUTOMATION_TOKEN }}
          FACTORY_MODE: ${{ vars.FACTORY_MODE || 'observe' }}
          FACTORY_PR_NUMBER: ${{ github.event.pull_request.number }}
