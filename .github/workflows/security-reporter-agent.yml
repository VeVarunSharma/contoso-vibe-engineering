name: Security Agent Workflow

# Run the full-repository AI assessment weekly instead of on every push.
# CodeQL, Dependabot, and Dependency Review provide change-level coverage.
on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-agent-workflow
  cancel-in-progress: true

jobs:
  security-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      copilot-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: npm i -g @github/copilot@1.0.83

      - name: Run Security Agent via Copilot CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p security-reports
          REPORT_PATH="security-reports/security-assessment-report.md"

          AGENT_PROMPT=$(cat .github/agents/security-reporter.agent.md)
          PROMPT="$AGENT_PROMPT"
          PROMPT+=$'\n\nContext:\n'
          PROMPT+="- Repository: $GITHUB_REPOSITORY"
          PROMPT+=$'\n\nTask:\n'
          PROMPT+=$"\n- Execute the instructions on the full codebase"
          PROMPT+=$'\n- Return the complete security report as your final response, summarizing findings, severity, and remediation guidance.'
          PROMPT+=$'\n- Do not modify repository files.'

          if ! copilot \
            --prompt "$PROMPT" \
            --silent \
            --no-color \
            --available-tools view rg glob \
            --allow-all-tools \
            --disable-builtin-mcps \
            --secret-env-vars=GITHUB_TOKEN \
            < /dev/null > "$REPORT_PATH"; then
            rm -f "$REPORT_PATH"
            exit 1
          fi

          if [ ! -s "$REPORT_PATH" ]; then
            echo "::error::Copilot completed without producing a security report."
            exit 1
          fi

      - name: Output security report as summary
        if: always()
        run: |
          set -euo pipefail
          REPORT_PATH="security-reports/security-assessment-report.md"

          if [ ! -f "$REPORT_PATH" ]; then
            echo "No security report generated; skipping summary."
            exit 0
          fi

          # Add a header to the summary
          echo "# Security Assessment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Append the full report content
          cat "$REPORT_PATH" >> $GITHUB_STEP_SUMMARY

      - name: Upload security report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-assessment-report-${{ github.run_id }}
          path: security-reports/security-assessment-report.md
          retention-days: 30

      - name: Check for critical vulnerabilities
        if: always()
        run: |
          set -euo pipefail
          REPORT_PATH="security-reports/security-assessment-report.md"

          if [ ! -f "$REPORT_PATH" ]; then
            echo "No security report generated; skipping critical check."
            exit 0
          fi

          if grep -q "THIS ASSESSMENT CONTAINS A CRITICAL VULNERABILITY" "$REPORT_PATH"; then
            echo "❌ CRITICAL VULNERABILITY DETECTED - Workflow failed"
            echo "The security assessment found critical vulnerabilities that must be addressed before proceeding."
            exit 1
          else
            echo "✅ No critical vulnerabilities detected"
          fi
