name: Complete Copilot PRs for Factory Validation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reset_issue:
        description: "Optional blocked factory issue to reset; never resets an ambiguous or active task"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
  checks: read

concurrency:
  group: dark-factory-mutation
  cancel-in-progress: false

jobs:
  complete:
    name: Validate and ready completed Copilot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/factory-runtime
      - name: Explicit operator reset
        if: github.event_name == 'workflow_dispatch' && inputs.reset_issue != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FACTORY_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_TASKS_TOKEN: ${{ secrets.COPILOT_AGENT_TASKS_TOKEN }}
          FACTORY_MODE: ${{ vars.FACTORY_MODE || 'observe' }}
          RESET_ISSUE: ${{ inputs.reset_issue }}
        run: node .github/scripts/dark-factory/dist/cli.js reset --issue-number "$RESET_ISSUE"
      - uses: ./.github/actions/factory-transition
        if: github.event_name != 'workflow_dispatch' || inputs.reset_issue == ''
        with:
          lane: complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FACTORY_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_TASKS_TOKEN: ${{ secrets.COPILOT_AGENT_TASKS_TOKEN }}
          PR_MERGE_AUTOMATION_TOKEN: ${{ secrets.PR_MERGE_AUTOMATION_TOKEN }}
          FACTORY_MODE: ${{ vars.FACTORY_MODE || 'observe' }}
