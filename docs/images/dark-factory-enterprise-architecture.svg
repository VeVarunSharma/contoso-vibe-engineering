<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Dark factory enterprise architecture</title>
  <desc id="desc">Architecture diagram showing maintainer opt-in, GitHub Actions control workflows, Copilot Agent Task implementation, full-scope pull request validation, external checks, Copilot review, deterministic merge gating, a manual emergency-stop override, repair loop, GitHub native auto-merge, main branch rules, state labels, and audit records.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="control" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="trust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .boundary-title { font: 700 14px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: 1.3px; fill: #334155; }
      .box-title { font: 700 17px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 13px Inter, "Segoe UI", Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .pill { font: 600 12px Inter, "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .lane { font: 700 13px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: 1px; fill: #1e40af; }
      .arrow-label { font: 600 11px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#page)"/>
  <text x="70" y="62" class="title">Dark Factory: Guarded Autonomous Delivery</text>
  <text x="70" y="91" class="subtitle">Full-scope GitHub Actions control plane • deterministic trust gates • Copilot build and review • native squash auto-merge</text>

  <!-- Trust boundaries -->
  <rect x="55" y="125" width="260" height="670" rx="18" fill="#fff" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="72" y="154" class="boundary-title">MAINTAINER OPT-IN BOUNDARY</text>

  <rect x="340" y="125" width="760" height="670" rx="18" fill="url(#control)" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="365" y="154" class="boundary-title">GITHUB ACTIONS CONTROL PLANE</text>

  <rect x="1125" y="125" width="420" height="670" rx="18" fill="url(#trust)" stroke="#059669" stroke-width="2.5"/>
  <text x="1150" y="154" class="boundary-title">GITHUB ENFORCEMENT &amp; EVIDENCE</text>

  <!-- Maintainer column -->
  <g filter="url(#shadow)">
    <rect x="80" y="190" width="210" height="130" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="220" class="box-title">Maintainer opt-in</text>
    <text x="100" y="248" class="box-text">
      <tspan x="100" dy="0">Focused issue + acceptance</tspan>
      <tspan x="100" dy="20">criteria. Apply factory:queued.</tspan>
      <tspan x="100" dy="20">No label = no dispatch.</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="555" width="210" height="145" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <text x="100" y="585" class="box-title" style="font-size:15px">Manual emergency stop</text>
    <text x="100" y="613" class="box-text">
      <tspan x="100" dy="0">Maintainer applies</tspan>
      <tspan x="100" dy="20">factory:human-review</tspan>
      <tspan x="100" dy="20">Blocks selection + revalidation</tspan>
      <tspan x="100" dy="20">Remove label to resume</tspan>
    </text>
  </g>

  <!-- Control plane lanes -->
  <text x="370" y="190" class="lane">ISSUE &amp; BUILD LANE</text>
  <g filter="url(#shadow)">
    <rect x="370" y="210" width="210" height="125" rx="13" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="390" y="240" class="box-title">Dark Factory Dispatch</text>
    <text x="390" y="267" class="box-text">
      <tspan x="390" dy="0">Issue events + 15 min</tspan>
      <tspan x="390" dy="19">Oldest eligible issue</tspan>
      <tspan x="390" dy="19">One dispatch per run</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="625" y="210" width="210" height="125" rx="13" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="645" y="240" class="box-title">Copilot Agent Task</text>
    <text x="645" y="267" class="box-text">
      <tspan x="645" dy="0">factory:building</tspan>
      <tspan x="645" dy="19">Implement + validate</tspan>
      <tspan x="645" dy="19">Draft copilot/* PR</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="880" y="210" width="190" height="125" rx="13" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="900" y="238" class="box-title" style="font-size:15px">Complete Copilot PRs</text>
    <text x="900" y="262" class="small">
      <tspan x="900" dy="0">Every 5 min</tspan>
      <tspan x="900" dy="18">Task + PR + branch match</tspan>
      <tspan x="900" dy="18">Exact head revalidation</tspan>
      <tspan x="900" dy="18">Ready + factory:validating</tspan>
    </text>
  </g>

  <text x="520" y="390" class="lane">PULL REQUEST VALIDATION LANE</text>
  <g filter="url(#shadow)">
    <rect x="370" y="410" width="225" height="145" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <text x="390" y="440" class="box-title">PR Merge Assistant</text>
    <text x="390" y="468" class="box-text">
      <tspan x="390" dy="0">Events + 15 min</tspan>
      <tspan x="390" dy="20">Scan trusted candidates</tspan>
      <tspan x="390" dy="20">Select one actionable PR</tspan>
      <tspan x="390" dy="20">Safe-output transition only</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="625" y="410" width="200" height="145" rx="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="645" y="440" class="box-title">Copilot reviewer</text>
    <text x="645" y="468" class="box-text">
      <tspan x="645" dy="0">Review newest commit</tspan>
      <tspan x="645" dy="20">New commit → re-review</tspan>
      <tspan x="645" dy="20">Requested changes → repair</tspan>
      <tspan x="645" dy="20">No human approval required</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="855" y="410" width="215" height="145" rx="13" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <text x="875" y="440" class="box-title">External checks</text>
    <text x="875" y="468" class="box-text">
      <tspan x="875" dy="0">Product CI / security</tspan>
      <tspan x="875" dy="20">Deployment / status contexts</tspan>
      <tspan x="875" dy="20">At least one reported</tspan>
      <tspan x="875" dy="20">All completed successfully</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="615" width="380" height="135" rx="16" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="545" y="647" class="box-title">Deterministic merge gate</text>
    <text x="545" y="675" class="box-text">
      <tspan x="545" dy="0">Trusted identity + same repo + main + copilot/*</tspan>
      <tspan x="545" dy="20">Current Copilot review + external checks + resolved threads</tspan>
      <tspan x="545" dy="20">Re-fetch live state → exact head SHA → one safe action</tspan>
      <tspan x="545" dy="20">Apply automerge + factory:merge-ready</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="925" y="615" width="145" height="135" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="945" y="645" class="box-title">Repair loop</text>
    <text x="945" y="672" class="small">
      <tspan x="945" dy="0">Conflict / failed check</tspan>
      <tspan x="945" dy="18">Unresolved thread</tspan>
      <tspan x="945" dy="18">CHANGES_REQUESTED</tspan>
      <tspan x="945" dy="18">Assign Copilot once</tspan>
    </text>
  </g>

  <!-- Enforcement column -->
  <g filter="url(#shadow)">
    <rect x="1155" y="190" width="360" height="120" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="1178" y="220" class="box-title">GitHub native auto-merge</text>
    <text x="1178" y="248" class="box-text">
      <tspan x="1178" dy="0">--auto --squash --match-head-commit</tspan>
      <tspan x="1178" dy="20">Secondary Draft PR Auto-Merge path</tspan>
      <tspan x="1178" dy="20">cannot create eligibility</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1155" y="350" width="360" height="165" rx="14" fill="#ffffff" stroke="#047857" stroke-width="2"/>
    <text x="1178" y="380" class="box-title">Dark factory main guardrails</text>
    <text x="1178" y="408" class="box-text">
      <tspan x="1178" dy="0">Target: refs/heads/main • no bypass actors</tspan>
      <tspan x="1178" dy="21">Pull request required • squash only</tspan>
      <tspan x="1178" dy="21">Resolved conversations required</tspan>
      <tspan x="1178" dy="21">0 required approving reviews</tspan>
      <tspan x="1178" dy="21">Non-fast-forward updates blocked</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1155" y="555" width="360" height="195" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="1178" y="585" class="box-title">Durable audit artifacts</text>
    <text x="1178" y="613" class="box-text">
      <tspan x="1178" dy="0">Issues, assignments, labels, Agent Tasks</tspan>
      <tspan x="1178" dy="21">PR head SHA, files, reviews, threads</tspan>
      <tspan x="1178" dy="21">Checks, deployments, merge commit</tspan>
      <tspan x="1178" dy="21">Actions logs, summaries, gh-aw artifacts</tspan>
      <tspan x="1178" dy="21">Ruleset and native merge enforcement</tspan>
      <tspan x="1178" dy="21">Proof: #465 → #466 → run 35952589222</tspan>
    </text>
  </g>

  <!-- Primary arrows -->
  <path d="M290 255 H365" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="300" y="243" class="arrow-label">factory:queued</text>
  <path d="M580 272 H620" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M835 272 H875" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M975 335 V380 H482 V405" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="735" y="372" class="arrow-label">ready + factory:validating</text>
  <path d="M595 482 H620" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M825 482 H850" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M725 555 V610" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M963 555 V610" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M900 720 H910 V770 H1120 V250 H1150" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="935" y="765" class="arrow-label">exact reviewed head</text>
  <path d="M1335 310 V345" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M1335 515 V550" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Repair loop and manual emergency-stop override -->
  <path d="M925 685 H905" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <path d="M997 615 V585 H725 V560" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <text x="830" y="578" class="arrow-label">repair + re-review</text>
  <path d="M295 627 H330 V660 H515" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="345" y="647" class="arrow-label">manual emergency stop</text>

  <!-- Labels and legend -->
  <rect x="55" y="830" width="1490" height="165" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="862" class="boundary-title">DURABLE STATE LABELS</text>

  <g>
    <rect x="80" y="885" width="155" height="34" rx="17" fill="#dcfce7" stroke="#16a34a"/>
    <text x="101" y="907" class="pill">factory:queued</text>
    <rect x="250" y="885" width="160" height="34" rx="17" fill="#dbeafe" stroke="#2563eb"/>
    <text x="270" y="907" class="pill">factory:building</text>
    <rect x="425" y="885" width="170" height="34" rx="17" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="443" y="907" class="pill">factory:validating</text>
    <rect x="610" y="885" width="180" height="34" rx="17" fill="#d1fae5" stroke="#059669"/>
    <text x="628" y="907" class="pill">factory:merge-ready</text>
    <rect x="805" y="885" width="185" height="34" rx="17" fill="#ffe4e6" stroke="#e11d48"/>
    <text x="823" y="907" class="pill">factory:human-review</text>
    <rect x="1005" y="885" width="165" height="34" rx="17" fill="#fee2e2" stroke="#dc2626"/>
    <text x="1025" y="907" class="pill">factory:blocked</text>
    <rect x="1185" y="885" width="120" height="34" rx="17" fill="#dcfce7" stroke="#16a34a"/>
    <text x="1213" y="907" class="pill">automerge</text>
  </g>

  <text x="80" y="955" class="boundary-title">LEGEND</text>
  <line x1="175" y1="950" x2="225" y2="950" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="238" y="955" class="small">control transition</text>
  <line x1="380" y1="950" x2="430" y2="950" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="443" y="955" class="small">validated / enforced path</text>
  <line x1="625" y1="950" x2="675" y2="950" stroke="#d97706" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <text x="688" y="955" class="small">repair loop</text>
  <line x1="805" y1="950" x2="855" y2="950" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="868" y="955" class="small">manual emergency stop</text>
  <rect x="1040" y="937" width="42" height="25" rx="6" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1095" y="955" class="small">trust boundary</text>
</svg>
